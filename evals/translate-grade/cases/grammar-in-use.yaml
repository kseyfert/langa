# Случаи набора translate-grade для рабочей области Grammar In Use (имя файла — область).
# Источник истины — этот файл: запуск синхронизирует его в датасет Langfuse
# grammar-in-use/translate-grade (новые и изменённые случаи — upsert, удалённые — в архив).
#
# tasks — задания (content как в exercises.content), cases ссылаются на них по task.
# Случай: answer — ответ ученика; expect:
#   verdict      — correct_target / correct_non_target / incorrect, или список допустимых;
#   target       — ожидаемый target.status: correct / error / partial / not_used, или список допустимых;
#   side_errors  — unit_id, которые должны быть в others со статусом error или partial;
#                  элемент-список [9, 11] — «найден любой из»; лишняя — побочная error/partial
#                  не из списка; [] — побочных ошибок быть не должно; ключа нет — не проверяются.
# Ветки: target — верно с целевой конструкцией; non-target — верно без неё;
# target-error — ошибка в целевой конструкции; side-error — целевая верна, ошибка другого
# юнита; edge — пограничный случай.
# Пока answer пуст или в expect нет verdict и target, случай не заполнен и в прогон не идёт.
workspace_id: 1
tasks:
  - id: 3-translate
    unit_id: 3    # 3. Present continuous and present simple 1 (I am doing and I do)
    # сгенерировано без записи в базу, translate-gen-v1, 2026-10-26
    content:
      instructions_ru: Переведи на английский.
      source_ru: Вообще я живу в Казани, но этот месяц я работаю в Тбилиси и снимаю маленькую квартиру у реки.
      target_note_ru: Временное проживание и работа на ограниченный срок передаются через present continuous (I'm working, I'm renting), а постоянное место жительства — через present simple (I live). Подсказки — «вообще» и «этот месяц».
      reference_en:
        - I normally live in Kazan, but this month I'm working in Tbilisi and renting a small flat by the river.
      focus:
        - временное проживание или работа до какого-то момента
  - id: 13-translate
    unit_id: 13    # 13. Present perfect and past 1 (I have done and I did)
    # сгенерировано без записи в базу, translate-gen-v1, 2026-10-26
    content:
      instructions_ru: Переведи на английский.
      source_ru: На прошлой неделе мы украшали ёлку у бабушки, и Маша разбила её любимый стеклянный шар. Когда бабушка его увидела, она просто засмеялась.
      target_note_ru: «На прошлой неделе» и «когда» указывают на законченное время в прошлом, поэтому здесь нужен только past simple (decorated, broke, saw, laughed). Present perfect с такими маркерами невозможен.
      reference_en:
        - Last week we decorated the Christmas tree at Grandma's, and Masha broke her favourite glass ball. When Grandma saw it, she just laughed.
      focus:
        - yesterday, last week, when — только с past simple
  - id: 28-translate
    unit_id: 28    # 28. must and can't
    # сгенерировано без записи в базу, translate-gen-v1, 2026-10-26
    content:
      instructions_ru: Переведи на английский.
      source_ru: Не может быть, что Дима сейчас играет в футбол с ребятами. Он же вчера сломал ногу и лежит дома.
      target_note_ru: "Когда ты уверен, что что-то прямо сейчас происходить не может, используй can't be + -ing. Не говори mustn't: для такого вывода оно не подходит."
      reference_en:
        - Dima can't be playing football with the guys right now. He broke his leg yesterday and is lying at home.
      focus:
        - невозможный процесс сейчас (can't be + -ing)
  - id: 38-translate
    unit_id: 38    # 38. if I do … and if I did …
    # сгенерировано без записи в базу, translate-gen-v1, 2026-10-26
    content:
      instructions_ru: Переведи на английский.
      source_ru: Я записан к врачу на пятницу. Если анализы будут готовы к утру, я заберу их по дороге. А вот если бы у меня был личный врач, я бы вообще не стоял в этих очередях.
      target_note_ru: Первое условие — реальный план, поэтому после if идёт present (are/will be не нужно), а в главной части — will. Второе — просто мечта, поэтому if + past (had), а в главной части — would.
      reference_en:
        - I have a doctor's appointment on Friday. If the test results are ready by the morning, I'll pick them up on the way. But if I had a private doctor, I wouldn't stand in these queues at all.
      focus:
        - "выбор: реальный план (if + present) или просто идея (if + past)"
  - id: 43-translate
    unit_id: 43    # 43. Passive 2 (be done / been done / being done)
    # сгенерировано без записи в базу, translate-gen-v1, 2026-10-26
    content:
      instructions_ru: Переведи на английский.
      source_ru: Результаты отборочного забега объявят завтра в полдень. Список участников финала вывесят на сайте клуба, так что приходить в зал не нужно.
      target_note_ru: "Действие выполняется кем-то неназванным в будущем, поэтому нужен пассив с will: will be announced, will be posted. Не забудь be после will и не добавляй to."
      reference_en:
        - The results of the qualifying run will be announced tomorrow at noon. The list of finalists will be posted on the club's website, so you don't need to come to the gym.
      focus:
        - "будущее в пассиве: объявление результатов, открытие (will be + V3)"
  - id: 56-translate
    unit_id: 56    # 56. Verb + -ing or to … 1 (remember, regret etc.)
    # сгенерировано без записи в базу, translate-gen-v1, 2026-10-26
    content:
      instructions_ru: Переведи на английский.
      source_ru: Через полчаса после того, как я выпил таблетку, боль начала отступать. Я начал надеяться, что к вечеру смогу вернуться на работу.
      target_note_ru: "После begin и start можно использовать и to + глагол, и -ing, смысл не меняется: began to fade, started to hope / started hoping. Следи, чтобы не получилось два -ing подряд, если сам глагол start стоит в форме -ing."
      reference_en:
        - Half an hour after I took the pill, the pain began to fade. I started to hope that I'd be able to go back to work by the evening.
      focus:
        - begin/start + -ing или to без разницы в смысле
  - id: 72-translate
    unit_id: 72    # 72. a/an and the
    # сгенерировано без записи в базу, translate-gen-v1, 2026-10-26
    content:
      instructions_ru: Переведи на английский.
      source_ru: Мой брат всегда ездит слишком быстро. Вчера, когда мы везли бабушку в больницу, он гнал под сто тридцать километров в час, хотя там ограничение — девяносто.
      target_note_ru: "Скорость в значении «в час» передаётся через an hour: 130 km an hour (не «in the hour» и не «per the hour»). Перед hour ставим an, потому что слово начинается с гласного звука."
      reference_en:
        - My brother always drives too fast. Yesterday, when we were taking Grandma to the hospital, he was doing 130 km an hour, even though the speed limit there is 90.
      focus:
        - a/an со скоростью (100 km an hour)

cases:
