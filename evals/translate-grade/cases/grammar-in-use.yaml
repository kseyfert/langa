    task: 3-translate
    answer: "I usually live in Kazan, but in this month I'm working in Tbilisi and renting a small flat by the river."
    expect: {verdict: "correct_target", target: "correct", side_errors: [121]}
  - id: 3-translate-edge   # continuous для постоянного, вторая часть верна
    task: 3-translate
    answer: "I am usually living in Kazan, but this month I'm working in Tbilisi and renting a small flat by the river."
    expect: {verdict: "incorrect", target: ["error", "partial"]}

