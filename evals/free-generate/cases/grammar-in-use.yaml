    topic: праздники

# Контрольные случаи судьи: готовое задание с известным дефектом (генерации нет — сразу к судье)
# и expect_fail — критерии, которые судья обязан провалить. Оценка — control_caught, отдельно
# от средних обычных случаев. Прогон только их: --controls-only.
controls:
  - id: control-free-38-real-money
    unit_id: 38  # 38. if I do … and if I did …
    # задание из базы free-generate с судьёй v1 (2026-10-26 12:36 UTC), повтор 2
    expect_fail: [requires_target]
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: Imagine your bank tells you that 50,000 euros has arrived in your account and it is yours to keep. What possibilities does that open up for you?
      reference_en:
        - If I had 50,000 euros, I could pay off my student loan straight away. I might also quit my job for a few months and travel, or I could finally start my own small business.
      focus:
        - воображаемое условие с could или might в главной части
  - id: control-free-40-wrong-turn
    unit_id: 40  # 40. if I had known … , I wish I had known …
    # задание из базы free-generate с судьёй v1 (2026-10-26 12:36 UTC), повтор 1
    expect_fail: [requires_target]
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: Last Saturday you took a wrong turn on a mountain trail and only got back to the car after dark. Looking back, what do you think went wrong?
      reference_en:
        - I was chatting with my friend the whole time and never checked the map. If I had been paying attention, I wouldn't have missed the turn. We might have reached the car before sunset if we hadn't been walking so slowly.
      focus:
        - длительное действие в условии в прошлом (if + had been + -ing)
