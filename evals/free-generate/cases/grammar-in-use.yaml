# Случаи набора free-generate для рабочей области Grammar In Use (имя файла — область).
# Источник истины — этот файл: запуск синхронизирует его в датасет Langfuse
# grammar-in-use/free-generate (новые и изменённые случаи — upsert, удалённые — в архив).
# topic — из src/server/tasks/topics.ts.
workspace_id: 1
cases:
  - id: present-continuous-simple
    unit_id: 3     # 3. Present continuous and present simple 1 (I am doing and I do)
    topic: работа в IT
  - id: present-perfect-past
    unit_id: 13    # 13. Present perfect and past 1 (I have done and I did)
    topic: путешествия
  - id: future-time-clauses
    unit_id: 25    # 25. when I do and when I've done, if and when
    topic: переезд и жильё
  - id: must-cant
    unit_id: 28    # 28. must and can't
    topic: соседи
  - id: mustnt-neednt
    unit_id: 32    # 32. must, mustn't, needn't
    topic: визит к врачу
  - id: if-i-do-if-i-did
    unit_id: 38    # 38. if I do … and if I did …
    topic: деньги и банк
  - id: if-i-had-known
    unit_id: 40    # 40. if I had known … , I wish I had known …
    topic: горы и походы
  - id: passive-2
    unit_id: 43    # 43. Passive 2 (be done / been done / being done)
    topic: город и транспорт
  - id: indirect-questions
    unit_id: 50    # 50. Questions 2 (do you know where … ? / he asked me where …)
    topic: покупки
  - id: auxiliary-verbs
    unit_id: 51    # 51. Auxiliary verbs (have/do/can etc.), I think so / I hope so etc.
    topic: друзья и выходные
  - id: ing-or-to
    unit_id: 56    # 56. Verb + -ing or to … 1 (remember, regret etc.)
    topic: учёба
  - id: a-an-the
    unit_id: 72    # 72. a/an and the
    topic: еда и кафе
  - id: adverb-word-order
    unit_id: 110   # 110. Word order 2: adverbs with the verb
    topic: спорт и тренировки
  - id: at-on-in-time
    unit_id: 121   # 121. at/on/in (time)
    topic: праздники

# Контрольные случаи судьи: готовое задание с известным дефектом (генерации нет — сразу к судье)
# и expect_fail — критерии, которые судья обязан провалить. Оценка — control_caught, отдельно
# от средних обычных случаев. Прогон только их: --controls-only.
controls:
  - id: control-free-40-wrong-turn
    unit_id: 40  # 40. if I had known … , I wish I had known …
    # задание из базы free-generate с судьёй v1 (2026-10-26 12:36 UTC), повтор 1
    expect_fail: [requires_target]
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: Last Saturday you took a wrong turn on a mountain trail and only got back to the car after dark. Looking back, what do you think went wrong?
      reference_en:
        - I was chatting with my friend the whole time and never checked the map. If I had been paying attention, I wouldn't have missed the turn. We might have reached the car before sunset if we hadn't been walking so slowly.
      focus:
        - длительное действие в условии в прошлом (if + had been + -ing)
  - id: control-free-3-coffee-machine
    unit_id: 3    # 3. Present continuous and present simple 1 (I am doing and I do)
    # синтетический: ситуация не даёт места конструкции из focus
    expect_fail: [requires_target, reference_ok]
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: Your office coffee machine is serviced by a technician every Monday morning. A new colleague asks how the machine is looked after. What do you tell her?
      reference_en:
        - A technician is always coming on Monday mornings to clean it. He's always checking the water filter and descaling it too, so the coffee tastes good all week and the machine never breaks down.
      focus:
        - "always + continuous: раздражающая чужая привычка (жалобы, опоздания, беспорядок)"
  - id: control-free-40-perfect-hike
    unit_id: 40   # 40. if I had known … , I wish I had known …
    # синтетический: ситуация не даёт места конструкции из focus
    expect_fail: [requires_target, reference_ok]
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: Last weekend you went hiking in perfect weather, reached the top early and had a picnic with a great view. A friend asks how the trip went. What do you tell them?
      reference_en:
        - I wish I hadn't left so early, and I wish I hadn't taken the steep path. But the view from the top was amazing, and our picnic in the sun was the best part of the whole weekend.
      focus:
        - сожаление о сделанном (wish + hadn't + V3)
  - id: control-free-28-car-wash
    unit_id: 28   # 28. must and can't
    # синтетический: ситуация не даёт места конструкции из focus
    expect_fail: [requires_target, reference_ok]
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: Yesterday you watched your neighbour wash his car outside for an hour. Today another neighbour asks whether he cleaned it himself or took it to a car wash. What do you say?
      reference_en:
        - He can't have taken it to a car wash. I watched him do it himself for a whole hour yesterday afternoon, with a bucket and a sponge, and he can't have missed a single spot.
      focus:
        - "невозможное в прошлом: забыл, видел, сделал — исключено (can't have + V3)"
