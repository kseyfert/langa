# Случаи набора translate-generate для рабочей области Grammar In Use (имя файла — область).
# Источник истины — этот файл: запуск синхронизирует его в датасет Langfuse
# grammar-in-use/translate-generate (новые и изменённые случаи — upsert, удалённые — в архив).
# topic — из src/server/tasks/topics.ts.
workspace_id: 1
cases:
  - id: present-continuous-simple
    unit_id: 3     # 3. Present continuous and present simple 1 (I am doing and I do)
    topic: работа в IT
  - id: present-perfect-past
    unit_id: 13    # 13. Present perfect and past 1 (I have done and I did)
    topic: путешествия
  - id: future-time-clauses
    unit_id: 25    # 25. when I do and when I've done, if and when
    topic: переезд и жильё
  - id: must-cant
    unit_id: 28    # 28. must and can't
    topic: соседи
  - id: mustnt-neednt
    unit_id: 32    # 32. must, mustn't, needn't
    topic: визит к врачу
  - id: if-i-do-if-i-did
    unit_id: 38    # 38. if I do … and if I did …
    topic: деньги и банк
  - id: if-i-had-known
    unit_id: 40    # 40. if I had known … , I wish I had known …
    topic: горы и походы
  - id: passive-2
    unit_id: 43    # 43. Passive 2 (be done / been done / being done)
    topic: город и транспорт
  - id: indirect-questions
    unit_id: 50    # 50. Questions 2 (do you know where … ? / he asked me where …)
    topic: покупки
  - id: auxiliary-verbs
    unit_id: 51    # 51. Auxiliary verbs (have/do/can etc.), I think so / I hope so etc.
    topic: друзья и выходные
  - id: ing-or-to
    unit_id: 56    # 56. Verb + -ing or to … 1 (remember, regret etc.)
    topic: учёба
  - id: a-an-the
    unit_id: 72    # 72. a/an and the
    topic: еда и кафе
  - id: adverb-word-order
    unit_id: 110   # 110. Word order 2: adverbs with the verb
    topic: спорт и тренировки
  - id: at-on-in-time
    unit_id: 121   # 121. at/on/in (time)
    topic: праздники

# Контрольные случаи судьи: готовое задание с известным дефектом (генерации нет — сразу к судье)
# и expect_fail — критерии, которые судья обязан провалить. Оценка — control_caught, отдельно
# от средних обычных случаев. Прогон только их: --controls-only.
controls:
  - id: control-translate-28-naverno
    unit_id: 28  # 28. must and can't
    # задание из базы translate-generate с судьёй v1 (2026-10-26 12:33 UTC), повтор 2
    expect_fail: [requires_target]
    content:
      instructions_ru: Переведи на английский.
      source_ru: "У соседей сверху уже третий час тишина, хотя обычно у них вечно кто-то топает. Они, наверное, совсем вымотались после переезда: сами же вчера говорили, что почти не спали."
      target_note_ru: Уверенный вывод о состоянии сейчас — must be + прилагательное (must be exhausted). Не используй mustn't и should, а также must have, ведь речь о настоящем состоянии.
      reference_en:
        - It's been quiet upstairs for three hours now, even though somebody is usually stomping around up there. The neighbours must be exhausted after the move – they said themselves yesterday that they'd hardly slept.
      focus:
        - "уверенный вывод о состоянии сейчас: усталость, голод, удивление (must be)"
  - id: control-translate-32-coffee
    unit_id: 32  # 32. must, mustn't, needn't
    # задание из базы translate-generate с судьёй v1 (2026-10-26 12:33 UTC), повтор 2
    expect_fail: [requires_target, reference_ok]
    content:
      instructions_ru: Переведи на английский.
      source_ru: Я так спешил в поликлинику, что даже не позавтракал, а приём, оказывается, задержали на сорок минут. Можно было спокойно выпить кофе дома.
      target_note_ru: "Действие уже совершено, но оказалось лишним, поэтому нужна конструкция needn't have + V3. Не используй didn't need to: она не показывает, что ты всё-таки это сделал."
      reference_en:
        - I was in such a hurry to get to the clinic that I didn't even have breakfast, but it turns out the appointment was delayed by forty minutes. I needn't have rushed – I could have calmly had a coffee at home.
      focus:
        - "сделал, но зря: лишняя еда, лишняя спешка, ненужная покупка (needn't have + V3)"
  - id: control-translate-13-kazhetsya
    unit_id: 13  # 13. Present perfect and past 1 (I have done and I did)
    # задание из базы translate-generate с судьёй v1 (2026-10-26 12:33 UTC), повтор 3
    expect_fail: [reference_ok]
    content:
      instructions_ru: Переведи на английский.
      source_ru: Нашего гида нигде нет. Кажется, он уехал вместе с туристами из соседнего отеля, а нам теперь придётся искать дорогу к водопаду самим.
      target_note_ru: "Гида сейчас нет на месте, и это результат его отъезда, поэтому нужен present perfect: has gone. Конкретного времени в прошлом не указано, акцент на нынешней ситуации."
      reference_en:
        - Our guide is nowhere to be found. He seems to have gone off with the tourists from the next hotel, so now we'll have to find our own way to the waterfall.
      focus:
        - "результат сейчас: человек ушёл и его здесь нет (present perfect)"
