# Случаи набора free-grade для рабочей области Grammar In Use (область — папка content/<key>/).
# Источник истины — этот файл: запуск синхронизирует его в датасет Langfuse
# grammar-in-use/free-grade (новые и изменённые случаи — upsert, удалённые — в архив).
#
# tasks — задания (content как в exercises.content), cases ссылаются на них по task.
# Случай: answer — ответ ученика; expect:
#   verdict      — correct_target / correct_non_target / incorrect, или список допустимых;
#   target       — ожидаемый target.status: correct / error / partial / not_used, или список допустимых;
#   side_errors  — unit_id, которые должны быть в others со статусом error или partial;
#                  элемент-список [9, 11] — «найден любой из»; лишняя — побочная error/partial
#                  не из списка; [] — побочных ошибок быть не должно; ключа нет — не проверяются.
# Ветки: target — верно с целевой конструкцией; non-target — верно без неё;
# target-error — ошибка в целевой конструкции; side-error — целевая верна, ошибка другого
# юнита; edge — пограничный случай.
# Пока answer пуст или в expect нет verdict и target, случай не заполнен и в прогон не идёт.
tasks:
  - id: 3-free
    unit_id: 3    # 3. Present continuous and present simple 1 (I am doing and I do)
    # сгенерировано без записи в базу, free-gen-v1, 2026-10-26
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: At a family birthday party, your relatives start teasing you about the silly little mistakes you make over and over. What do they say, and how do you feel about it?
      reference_en:
        - My brother says I'm always locking myself out of the flat, and he's right. I'm also always spilling coffee on my shirt just before meetings! I laugh along with them, but it's a bit embarrassing.
      focus:
        - "always + continuous: что-то случается слишком часто с самим говорящим (терять, забывать)"
  - id: 13-free
    unit_id: 13    # 13. Present perfect and past 1 (I have done and I did)
    # сгенерировано без записи в базу, free-gen-v1, 2026-10-26
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: Your university is naming a new reading room after a professor who died last year. A first-year student asks you who she was. What do you tell them?
      reference_en:
        - She taught physics here for thirty years. She wrote two textbooks, and many of us learned from them. She also started a free evening course for adults, and hundreds of people joined it.
      focus:
        - дела умершего человека
  - id: 28-free
    unit_id: 28    # 28. must and can't
    # сгенерировано без записи в базу, free-gen-v1, 2026-10-26
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: Your landlord phones and says the people in the flat above you were having loud parties every night last week. But you were at home all week, and you know those tenants were away on holiday. What do you tell him?
      reference_en:
        - They can't have been having parties every night. I was at home all week and I didn't hear a thing. The tenants were on holiday, so they can't have been making any noise. Someone has given you wrong information.
      focus:
        - невозможный длительный процесс в прошлом (can't have been + -ing)
  - id: 38-free
    unit_id: 38    # 38. if I do … and if I did …
    # сгенерировано без записи в базу, free-gen-v1, 2026-10-26
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: Your teammate is leading tomorrow's training session for the first time, and you can't be there. What do you text him about possible problems?
      reference_en:
        - If it rains, move the session into the gym and message everyone first. If somebody gets injured, call me or the club doctor straight away. And if you run out of balls, ask the other team to lend you some.
      focus:
        - инструкция или просьба при условии (if + present, повелительное)
  - id: 43-free
    unit_id: 43    # 43. Passive 2 (be done / been done / being done)
    # сгенерировано без записи в базу, free-gen-v1, 2026-10-26
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: "You ordered a winter coat online, but the parcel arrived a week late and the box was crushed. You are writing to customer service: what do you say went wrong?"
      reference_en:
        - My coat should have been delivered last Monday, but it arrived a week late. The box was crushed, so it clearly could have been packed more carefully. It shouldn't have been left outside my door, either.
      focus:
        - "прошлое с модальными: надо было, могли бы (should / could have been + V3)"
  - id: 56-free
    unit_id: 56    # 56. Verb + -ing or to … 1 (remember, regret etc.)
    # сгенерировано без записи в базу, free-gen-v1, 2026-10-26
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: Think about a weekend trip or a night out with friends that was so memorable you still talk about it. What was it like for you?
      reference_en:
        - Last summer my friends and I went camping by a lake. I'll never forget waking up at dawn and seeing mist over the water. We still talk about it, and I'll never forget laughing so hard around the fire that night.
      focus:
        - "never forget + -ing: никогда не забуду, как делал"
  - id: 72-free
    unit_id: 72    # 72. a/an and the
    # сгенерировано без записи в базу, free-gen-v1, 2026-10-26
    content:
      instructions_ru: Ответь по-английски в 2–4 предложениях.
      prompt_en: A friend is visiting your town for the first time and arrives by plane late at night. Tell them how to get to your home.
      reference_en:
        - Take the bus from the airport to the city centre – it runs all night. Get off next to the station and I'll meet you there. If you miss the last bus, a taxi is about €30, and the driver will know my street.
      focus:
        - the + привычные места в городе (the bank, the post office, the station, the airport, the city centre)

