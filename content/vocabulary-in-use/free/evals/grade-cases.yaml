  - id: 8-free-edge   # sensible в верном значении «благоразумный»
    task: 8-free
    answer: "I am a sensible person, so I try to listen to criticism calmly and think about whether it is fair. But after a long day I am often tense, and I can get annoyed very quickly."
    expect: {verdict: "correct_target", target: "correct", side_errors: []}

