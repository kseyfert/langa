  - id: 8-free-target-error   # sensible вместо sensitive; stressed out верно
    task: 8-free
    answer: "After a long day I am usually stressed out, so I need an hour to calm down. I am also very sensible to criticism: I get upset easily, even when people are only trying to help me."
    expect: {verdict: "incorrect", target: ["partial", "error"], side_errors: []}
  - id: 8-free-collocation-error   # sensitive to, не on
    task: 8-free
    answer: "After a long day at work I am usually wound up and cannot sleep. I am also quite sensitive on criticism, so I get upset even when my boss makes a small comment about my work."
