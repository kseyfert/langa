    task: 16-translate
    answer: "\"What do you do for a living?\" \"I work in publishing, but translation is how I really make a living. What about you?\""
    expect: {verdict: "correct_target", target: "correct", side_errors: []}

  - id: 40-translate-target
    task: 40-translate
    answer: "I went to the bank to get a loan, but the manager said that because of my credit rating they would charge me higher interest. Now I am not sure whether I should borrow money at all."
    expect: {verdict: "correct_target", target: "correct", side_errors: []}
  - id: 40-translate-non-target   # обход общими словами теряет точность
    task: 40-translate
    answer: "I went to the bank to ask for money, but the manager told me that because I had problems paying money back in the past, I would have to pay more. Now I am not sure I should take money from anyone at all."
    expect: {verdict: "incorrect", target: "not_used", side_errors: []}
  - id: 40-translate-target-error   # *a credit, *percent
    task: 40-translate
    answer: "I went to the bank for a credit, but the manager said that because of my credit rating they would take a higher percent from me. Now I am not sure whether I should borrow money at all."
    expect: {verdict: "incorrect", target: ["error", "partial"], side_errors: []}
  - id: 40-translate-collocation-error   # interest неисчисл.; charge sb interest, не from
    task: 40-translate
    answer: "I went to the bank for a loan, but the manager said that because of my credit rating they would charge higher interests from me. Now I am not sure whether I should borrow money at all."
    expect: {verdict: "incorrect", target: ["partial", "error"], side_errors: []}
  - id: 40-translate-edge   # credit history — нормальный английский
    task: 40-translate
    answer: "I went to the bank for a loan, but the manager said that because of my credit history they would charge me a higher interest rate. Now I am wondering whether to borrow money at all."
    expect: {verdict: "correct_target", target: "correct", side_errors: []}

  - id: 64-translate-target
    task: 64-translate
    answer: "Are you surprised that Max did not come to the party? He was off sick all week, so there is nothing strange about it. After all, he has only just recovered."
    expect: {verdict: "correct_target", target: "correct", side_errors: []}
  - id: 64-translate-non-target
    task: 64-translate
    answer: "Are you surprised that Max did not come to the party? He was ill all week, so it is not strange. Remember, he has only just recovered."
    expect: {verdict: "correct_non_target", target: "not_used", side_errors: []}
  - id: 64-translate-target-error   # on the contrary вместо after all
    task: 64-translate
    answer: "Are you surprised that Max did not come to the party? On the contrary, it is not strange: he was ill all week, and he has only just recovered."
    expect: {verdict: "incorrect", target: ["error", "partial"], side_errors: []}
  - id: 64-translate-collocation-error   # after all of that — «после всего этого», смысл другой
    task: 64-translate
    answer: "Are you surprised that Max did not come to the party? He was off sick all week, so it is not strange. After all of that, he has only just recovered."
    expect: {verdict: "incorrect", target: ["error", "partial"], side_errors: []}
  - id: 64-translate-edge   # in the end вместо after all — типичная ошибка
    task: 64-translate
    answer: "Are you surprised that Max did not come to the party? He was off sick all week, so it is not strange. In the end, he has only just recovered."
    expect: {verdict: "incorrect", target: ["error", "not_used"], side_errors: []}

  - id: 70-translate-target
    task: 70-translate
    answer: "The lease says that the tenant has to pay the rent by the fifth of each month. If the money is transferred by the tenant's employer and not by the tenant, the landlady's name must still be written in the payee field."
    expect: {verdict: "correct_target", target: "correct", side_errors: []}
  - id: 70-translate-non-target
    task: 70-translate
    answer: "The lease says that the tenant has to pay the rent by the fifth of each month. If the money is sent by the company where the tenant works, you still need to write the landlady's name in the box for the person who receives the payment."
    expect: {verdict: "correct_non_target", target: "not_used", side_errors: []}
  - id: 70-translate-target-error   # employee вместо employer, payer вместо payee
    task: 70-translate
    answer: "The lease says that the tenant has to pay the rent by the fifth of each month. If the money is transferred by the tenant's employee and not by the tenant, the landlady's name must still be written in the payer field."
    expect: {verdict: "incorrect", target: ["error", "partial"], side_errors: []}
  - id: 70-translate-collocation-error   # addressee — у писем; в платеже payee
    task: 70-translate
    answer: "The lease says that the tenant has to pay the rent by the fifth of each month. If the money is transferred by the tenant's employer, the landlady's name must still be written in the addressee field."
    expect: {verdict: "incorrect", target: ["partial", "error"], side_errors: []}
  - id: 70-translate-edge   # recipient вместо payee без ошибки; employer верно
    task: 70-translate
    answer: "The lease says that the tenant has to pay the rent by the fifth of each month. If the tenant's employer pays instead of the tenant, the landlady must still be named as the recipient."
    expect: {verdict: "correct_target", target: "correct", side_errors: []}

