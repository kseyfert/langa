    task: 89-rephrase
    answer: "After weeks of arguing about where to hold the team's annual conference, Priya finally made up her mind yesterday and told everyone it was settled."
    expect: {verdict: ["correct_target", "correct_non_target"], target: ["correct", "not_used"], side_errors: []}

