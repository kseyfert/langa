  - id: 89-rephrase-non-target
    task: 89-rephrase
    answer: "After weeks of arguing about where to hold the team's annual conference, Priya finally decided on a venue yesterday and told everyone it was settled."
    expect: {verdict: "correct_non_target", target: "not_used", side_errors: []}
