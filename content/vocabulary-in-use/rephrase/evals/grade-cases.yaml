    task: 89-rephrase
    answer: "After weeks of arguing about where to hold the team's annual conference, Priya finally did a decision yesterday and told everyone it was settled."
    expect: {verdict: "incorrect", target: ["error", "partial"], side_errors: []}
  - id: 89-rephrase-collocation-error   # decision about / on, не of
    task: 89-rephrase
