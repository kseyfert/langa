    task: 70-rephrase
    answer: "My aunt spent thirty years as a physician, and now she supervises a team of machine operators in a bottling plant."
    expect: {verdict: "incorrect", target: ["partial", "error"], side_errors: []}
  - id: 70-rephrase-collocation-error   # supervisor of a team, не at
    task: 70-rephrase
    answer: "My aunt was a physicist for thirty years, and now she works as a supervisor at a team of machine operators in a bottling plant."
    expect: {verdict: "incorrect", target: ["partial", "error"], side_errors: []}
  - id: 70-rephrase-edge   # глагол supervise вместо supervisor — верно
    task: 70-rephrase
    answer: "My aunt spent thirty years as a physicist, and now she supervises a team of machine operators in a bottling plant."
    expect: {verdict: "correct_target", target: "correct", side_errors: []}

